name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Write Firebase config
        shell: bash
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID }}
          # 打字練習成績走「另一個」Firebase 專案（lotes-typing-practice），
          # 規則檔獨立，改它碰不到上面那三個共用 study-b2e59 的專案。
          TYPING_FIREBASE_API_KEY: ${{ secrets.TYPING_FIREBASE_API_KEY }}
          TYPING_FIREBASE_AUTH_DOMAIN: ${{ vars.TYPING_FIREBASE_AUTH_DOMAIN }}
          TYPING_FIREBASE_PROJECT_ID: ${{ vars.TYPING_FIREBASE_PROJECT_ID }}
          TYPING_FIREBASE_APP_ID: ${{ vars.TYPING_FIREBASE_APP_ID }}
          TYPING_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.TYPING_FIREBASE_MESSAGING_SENDER_ID }}
        run: |
          cat > "projects/班級作品牆/firebase-config.js" <<EOF
          window.TeacherProjectWallFirebaseConfig = {
            apiKey: "${FIREBASE_API_KEY}",
            authDomain: "${FIREBASE_AUTH_DOMAIN}",
            projectId: "${FIREBASE_PROJECT_ID}",
            storageBucket: "${FIREBASE_STORAGE_BUCKET}",
            messagingSenderId: "${FIREBASE_MESSAGING_SENDER_ID}",
            appId: "${FIREBASE_APP_ID}",
            measurementId: "${FIREBASE_MEASUREMENT_ID}"
          };
          EOF

          cat > "projects/AI音樂MV成果集/firebase-config.js" <<EOF
          window.TeacherMusicMvFirebaseConfig = {
            apiKey: "${FIREBASE_API_KEY}",
            authDomain: "${FIREBASE_AUTH_DOMAIN}",
            projectId: "${FIREBASE_PROJECT_ID}",
            storageBucket: "${FIREBASE_STORAGE_BUCKET}",
            messagingSenderId: "${FIREBASE_MESSAGING_SENDER_ID}",
            appId: "${FIREBASE_APP_ID}",
            measurementId: "${FIREBASE_MEASUREMENT_ID}"
          };
          EOF

          cat > "projects/儀表板入口/firebase-config.js" <<EOF
          window.TeacherDashboardFirebaseConfig = {
            apiKey: "${FIREBASE_API_KEY}",
            authDomain: "${FIREBASE_AUTH_DOMAIN}",
            projectId: "${FIREBASE_PROJECT_ID}",
            storageBucket: "${FIREBASE_STORAGE_BUCKET}",
            messagingSenderId: "${FIREBASE_MESSAGING_SENDER_ID}",
            appId: "${FIREBASE_APP_ID}",
            measurementId: "${FIREBASE_MEASUREMENT_ID}"
          };
          EOF

          cat > "projects/打字練習/firebase-config.js" <<EOF
          window.TypingPracticeFirebaseConfig = {
            apiKey: "${TYPING_FIREBASE_API_KEY}",
            authDomain: "${TYPING_FIREBASE_AUTH_DOMAIN}",
            projectId: "${TYPING_FIREBASE_PROJECT_ID}",
            appId: "${TYPING_FIREBASE_APP_ID}",
            messagingSenderId: "${TYPING_FIREBASE_MESSAGING_SENDER_ID}"
          };
          EOF

      # GitHub Pages 對靜態檔送 Cache-Control: max-age=600，所以更新後最多十分鐘
      # 會有機器拿到舊的 JS／CSS。最難查的不是「看到舊版」，是**新 HTML 配舊 JS**：
      # 頁面長得像新的，但某個新函式在舊檔裡不存在，整支程式在半路拋例外死掉，
      # 畫面停在一個看起來正常、其實已經壞掉的狀態（2026-09-03 於本機實測到這個症狀）。
      #
      # 作法是把 HTML 裡的 ?v=__BUILD__ 換成這次的 commit SHA：檔案內容變了、
      # 網址就跟著變，瀏覽器沒得快取。
      #
      # 🕳️ **佔位符一定要是 __BUILD__ 這種獨特字串，不能只認 `?v=`。**
      # 第一版寫成「把 ?v= 後面的東西全換掉」，結果 2026-09-03 上線後改壞兩處：
      #   1. AI音樂MV成果集有個輸入框 placeholder 是
      #      `https://www.youtube.com/watch?v=...`，被改成 watch?v=<sha>，
      #      **那是給人看的提示文字，不是資源網址**。
      #   2. 儀表板入口自己手動維護 ?v=20260514-4，被這裡接管了，
      #      等於偷偷改掉別的專案的作法。
      # 所以除了認佔位符，也只匹配 src=／href= 指向 .js／.css 的地方。
      - name: 靜態資源版本號改成 commit SHA（避免新 HTML 配舊 JS）
        run: |
          set -euo pipefail
          V="${GITHUB_SHA::7}"
          total=0
          while IFS= read -r f; do
            # grep 沒配到會回 1，配上 set -euo pipefail 會讓整個部署在
            # 「某個 HTML 沒有版本號」時直接掛掉——那些頁面本來就不需要，
            # 所以這裡明確吞掉非零離開碼，不要讓它變成部署失敗。
            n=$(grep -o '__BUILD__' "$f" | wc -l || true)
            if [ "$n" -gt 0 ]; then
              sed -i -E "s#(src|href)=\"([^\"]+\.(js|css))\?v=__BUILD__\"#\1=\"\2?v=$V\"#g" "$f"
              left=$(grep -c '__BUILD__' "$f" || true)
              if [ "$left" -ne 0 ]; then
                echo "::error::$f 還有 $left 個 __BUILD__ 沒被換掉（多半是寫在 src/href 以外的地方）"
                exit 1
              fi
              echo "$f：$n 個資源加上版本號 $V"
              total=$((total + n))
            fi
          done < <(find projects -name '*.html')
          # 一個都沒換到＝佔位符被誰改掉了。這種事不會報錯，只會在上課那天
          # 以「有幾台看到舊版」的形式出現，所以寧可讓部署直接失敗。
          if [ "$total" -eq 0 ]; then
            echo "::error::HTML 裡找不到任何 ?v= 佔位符，快取破解沒有生效"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
