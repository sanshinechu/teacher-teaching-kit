<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>羅東國民小學 3D 校園導覽地圖 ｜ LOTES Campus 3D</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@300;400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-color: #f5f8f5;
      --text-main: #243329;
      --text-muted: #607267;
      --primary: #2d6a4f;
      --primary-light: #40916c;
      --accent: #d4a373;
      --panel-bg: rgba(255, 255, 255, 0.92);
      --panel-border: rgba(45, 106, 79, 0.18);
      --panel-shadow: 0 12px 36px rgba(0, 0, 0, 0.1);
      --radius: 14px;
      --font-family: "LXGW WenKai TC", "Noto Sans TC", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-family);
      background: var(--bg-color);
      color: var(--text-main);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      user-select: none;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      outline: none;
    }

    /* 頂部列 */
    .topbar {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      height: 56px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      box-shadow: var(--panel-shadow);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-main);
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      background: var(--primary);
      color: #fff;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
    }

    .brand-title strong {
      font-size: 17px;
      letter-spacing: 0.5px;
      display: block;
    }

    .brand-title small {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .nav-links {
      display: flex;
      gap: 8px;
    }

    .nav-btn {
      background: none;
      border: none;
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13.5px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      background: rgba(45, 106, 79, 0.08);
      color: var(--primary);
    }

    /* 左側邊欄（支援一鍵收合） */
    .sidebar {
      position: absolute;
      top: 82px;
      left: 14px;
      bottom: 20px;
      width: 310px;
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      box-shadow: var(--panel-shadow);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      z-index: 20;
      padding: 16px;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sidebar.collapsed {
      transform: translateX(-340px);
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .sidebar-header h2 {
      font-size: 17px;
      color: var(--primary);
    }

    /* 邊欄浮動收合／展開按鈕 */
    .sidebar-toggle-btn {
      position: absolute;
      top: 82px;
      left: 14px;
      width: 42px;
      height: 42px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      box-shadow: var(--panel-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 19;
      color: var(--primary);
      transition: all 0.2s;
    }

    .sidebar-toggle-btn:hover {
      background: #ffffff;
      transform: scale(1.05);
    }

    .searchbox {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      border: 1px solid #d4ded7;
      border-radius: 8px;
      padding: 6px 12px;
      margin-bottom: 12px;
    }

    .searchbox input {
      border: none;
      outline: none;
      width: 100%;
      font-family: inherit;
      font-size: 13.5px;
      background: transparent;
    }

    .category-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .category-tabs button {
      background: #edf2ee;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      color: var(--text-muted);
      white-space: nowrap;
      transition: all 0.2s;
    }

    .category-tabs button.active {
      background: var(--primary);
      color: #fff;
    }

    .place-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
    }

    .place-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 11px;
      background: #ffffff;
      border: 1px solid #e3ebe5;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      text-align: left;
      transition: all 0.2s;
    }

    .place-item:hover, .place-item.selected {
      background: #eef6f1;
      border-color: var(--primary-light);
      transform: translateX(2px);
    }

    .place-symbol {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #e5efe8;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      margin-right: 8px;
    }

    .place-name {
      font-weight: 700;
      font-size: 13.5px;
      display: block;
    }

    .place-type {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* 右上視角與工具列 */
    .view-switch {
      position: absolute;
      top: 82px;
      right: 14px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 5px;
      display: flex;
      gap: 5px;
      z-index: 20;
    }

    .view-switch button {
      background: none;
      border: none;
      padding: 7px 11px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .view-switch button.active {
      background: var(--primary);
      color: #fff;
    }

    .map-toolbar {
      position: absolute;
      top: 142px;
      right: 14px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 5px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      z-index: 20;
    }

    .tool-btn {
      width: 38px;
      height: 38px;
      border: none;
      background: none;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-main);
      transition: all 0.2s;
    }

    .tool-btn:hover {
      background: rgba(45, 106, 79, 0.1);
      color: var(--primary);
    }

    .tool-btn.active {
      background: #e2f0e7;
      color: var(--primary);
    }

    /* 詳細卡片 */
    .detail-card {
      position: absolute;
      bottom: 20px;
      right: 14px;
      width: 350px;
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      box-shadow: var(--panel-shadow);
      border-radius: var(--radius);
      padding: 18px;
      z-index: 20;
      transform: translateY(120%);
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .detail-card.has-selection {
      transform: translateY(0);
      opacity: 1;
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }

    .detail-card h3 {
      font-size: 19px;
      color: var(--primary);
    }

    .detail-category {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: block;
    }

    .detail-card p {
      font-size: 13.5px;
      line-height: 1.6;
      color: #38493d;
      margin-bottom: 12px;
    }

    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 12px;
    }

    .tag-chip {
      font-size: 11px;
      padding: 3px 8px;
      background: #e8f2ec;
      border-radius: 4px;
      color: var(--primary);
    }

    .close-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
    }

    /* 底部操作 */
    .bottom-bar {
      position: absolute;
      bottom: 20px;
      left: 340px;
      display: flex;
      gap: 10px;
      z-index: 20;
      transition: left 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sidebar.collapsed ~ .bottom-bar {
      left: 70px;
    }

    .pill-btn {
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--panel-border);
      padding: 9px 16px;
      border-radius: 30px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13.5px;
      display: flex;
      align-items: center;
      gap: 7px;
      box-shadow: var(--panel-shadow);
      transition: all 0.2s;
    }

    .pill-btn:hover {
      background: #ffffff;
      color: var(--primary);
    }

    .tourbar {
      position: absolute;
      bottom: 68px;
      left: 340px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 30px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--panel-shadow);
      z-index: 20;
      transition: left 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sidebar.collapsed ~ .tourbar {
      left: 70px;
    }

    .tour-progress {
      width: 90px;
      height: 4px;
      background: #dce5de;
      border-radius: 2px;
      overflow: hidden;
    }

    .tour-progress span {
      display: block;
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s;
    }

    .walk-controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 10px 20px;
      border-radius: 24px;
      font-size: 13px;
      pointer-events: none;
      z-index: 25;
    }

    dialog {
      margin: auto;
      padding: 22px;
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      background: #ffffff;
      width: 90%;
      max-width: 680px;
      max-height: 80vh;
      overflow-y: auto;
      font-family: var(--font-family);
      outline: none;
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
    }

    .dialog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      border-bottom: 1px solid #edf2ee;
      padding-bottom: 10px;
    }

    .dialog-header h2 {
      color: var(--primary);
      font-size: 21px;
    }

    .office-group {
      margin-bottom: 18px;
    }

    .office-group h3 {
      font-size: 15.5px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }

    .office-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 8px;
    }

    .office-item {
      background: #f7faf8;
      border: 1px solid #e2ede5;
      padding: 9px 12px;
      border-radius: 8px;
      display: flex;
      gap: 10px;
    }

    .office-floor {
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 4px;
      height: fit-content;
    }

    .grade-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }

    .grade-table th, .grade-table td {
      border: 1px solid #e2ece5;
      padding: 9px 12px;
      text-align: left;
    }

    .grade-table th {
      background: #f0f6f2;
      color: var(--primary);
    }

    #loading {
      position: absolute;
      inset: 0;
      background: #dbe7df;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      font-size: 16px;
      color: var(--primary);
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(45, 106, 79, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 手機與平板行動裝置響應式設計（Mobile RWD） */
    .mobile-nav-toggle {
      display: none;
      width: 36px;
      height: 36px;
      border: 1px solid var(--panel-border);
      background: var(--panel-bg);
      border-radius: 8px;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--primary);
      transition: all 0.2s;
    }

    .open-btn-text {
      display: inline-block;
    }

    @media (max-width: 768px) {
      .topbar {
        top: 8px;
        left: 8px;
        right: 8px;
        height: 48px;
        padding: 0 10px;
        border-radius: 11px;
      }

      .brand {
        gap: 8px;
      }

      .brand-logo {
        width: 30px;
        height: 30px;
        font-size: 15px;
        border-radius: 7px;
      }

      .brand-title strong {
        font-size: 13.5px;
        letter-spacing: 0;
      }

      .brand-title small {
        display: none;
      }

      .mobile-nav-toggle {
        display: flex;
      }

      .nav-links {
        display: none;
        position: absolute;
        top: 54px;
        right: 0;
        background: var(--panel-bg);
        backdrop-filter: blur(14px);
        border: 1px solid var(--panel-border);
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.16);
        border-radius: 12px;
        padding: 8px;
        flex-direction: column;
        gap: 4px;
        min-width: 145px;
        z-index: 60;
      }

      .nav-links.open {
        display: flex;
        animation: navSlideDown 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes navSlideDown {
        from {
          opacity: 0;
          transform: translateY(-8px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .nav-btn {
        width: 100%;
        padding: 9px 12px;
        font-size: 13px;
        justify-content: flex-start;
      }

      .sidebar {
        top: 62px;
        left: 8px;
        right: 8px;
        bottom: 12px;
        width: auto;
        max-width: calc(100vw - 16px);
        padding: 14px;
        z-index: 50;
        border-radius: 12px;
      }

      .sidebar.collapsed {
        transform: translateX(calc(-100% - 24px));
      }

      .sidebar-toggle-btn {
        top: 62px;
        left: 8px;
        width: auto;
        height: 35px;
        padding: 0 10px;
        gap: 5px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 700;
        z-index: 25;
      }

      .view-switch {
        top: 62px;
        right: 8px;
        padding: 3px;
        gap: 3px;
        border-radius: 9px;
        z-index: 25;
        max-width: calc(100vw - 110px);
        overflow-x: auto;
      }

      .view-switch button {
        padding: 5px 8px;
        font-size: 11px;
        gap: 4px;
        border-radius: 6px;
        white-space: nowrap;
      }

      .view-switch button i {
        width: 14px;
        height: 14px;
      }

      .map-toolbar {
        top: 105px;
        right: 8px;
        padding: 3px;
        gap: 4px;
        border-radius: 9px;
        z-index: 25;
      }

      .tool-btn {
        width: 34px;
        height: 34px;
        border-radius: 7px;
      }

      .tool-btn i {
        width: 16px;
        height: 16px;
      }

      .detail-card {
        bottom: 10px;
        left: 8px;
        right: 8px;
        width: auto;
        max-height: 48vh;
        overflow-y: auto;
        padding: 14px;
        border-radius: 12px;
        z-index: 40;
      }

      .detail-card h3 {
        font-size: 17px;
      }

      .detail-card p {
        font-size: 12.5px;
        margin-bottom: 8px;
      }

      .bottom-bar {
        left: 50% !important;
        transform: translateX(-50%);
        bottom: 12px;
        width: max-content;
        z-index: 30;
      }

      .pill-btn {
        padding: 8px 14px;
        font-size: 12.5px;
        border-radius: 20px;
      }

      .detail-card.has-selection ~ .bottom-bar {
        opacity: 0;
        pointer-events: none;
        transform: translateX(-50%) translateY(20px);
      }

      .tourbar {
        left: 50% !important;
        transform: translateX(-50%);
        bottom: 12px;
        width: calc(100vw - 20px);
        max-width: 360px;
        padding: 7px 12px;
        gap: 6px;
        border-radius: 20px;
        z-index: 35;
      }

      .tour-progress {
        width: 55px;
      }

      #tour-name {
        font-size: 12.5px;
        max-width: 105px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .walk-controls {
        bottom: 56px;
        width: 90%;
        padding: 8px 12px;
        font-size: 11px;
      }

      dialog {
        width: 94%;
        padding: 16px;
        max-height: 85vh;
      }

      .dialog-header h2 {
        font-size: 17px;
      }

      .office-grid {
        grid-template-columns: 1fr;
      }

      .grade-table th, .grade-table td {
        padding: 6px 8px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <a class="brand" href="#">
        <div class="brand-logo">羅</div>
        <div class="brand-title">
          <strong>宜蘭縣羅東國小</strong>
          <small>校園 3D 導覽地圖 · CAMPUS EXPLORER</small>
        </div>
      </a>
      <button class="mobile-nav-toggle" id="mobile-nav-toggle" title="功能選單" aria-label="功能選單">
        <i data-lucide="more-vertical"></i>
      </button>
      <nav class="nav-links" id="top-nav-links">
        <button class="nav-btn" id="offices-btn">
          <i data-lucide="building-2"></i><span>處室配置</span>
        </button>
        <button class="nav-btn" id="grades-btn">
          <i data-lucide="graduation-cap"></i><span>年級教室</span>
        </button>
        <button class="nav-btn" id="map-btn">
          <i data-lucide="map"></i><span>2D 平面圖</span>
        </button>
        <a class="nav-btn" href="https://www.lotes.ilc.edu.tw/" target="_blank" rel="noopener noreferrer">
          <span>學校官網</span><i data-lucide="arrow-up-right"></i>
        </a>
      </nav>
    </header>

    <main id="scene" tabindex="0">
      <div id="loading">
        <div class="spinner"></div>
        <p>正在展開羅東國小百年校園…</p>
      </div>
    </main>

    <!-- 展開側欄的小按鈕 -->
    <button class="sidebar-toggle-btn" id="sidebar-open-btn" title="展開校園地點清單" style="display: none;">
      <i data-lucide="map-pin"></i><span class="open-btn-text">地點清單</span>
    </button>

    <!-- 左側邊欄 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>漫遊羅東國小</h2>
        <button class="close-btn" id="sidebar-close-btn" title="收合面板"><i data-lucide="chevron-left"></i></button>
      </div>
      <div class="searchbox">
        <i data-lucide="search"></i>
        <input id="place-search" placeholder="搜尋涵育樓、電腦教室、孔雀門…" autocomplete="off">
      </div>
      <div class="category-tabs" id="categories">
        <button class="active" data-cat="all">全部</button>
        <button data-cat="teaching">教學大樓</button>
        <button data-cat="admin">行政核心</button>
        <button data-cat="sports">運動場地</button>
        <button data-cat="gate">特色校門</button>
      </div>
      <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 6px;" id="list-count">載入中…</div>
      <div class="place-list" id="place-list"></div>
    </aside>

    <div class="view-switch">
      <button class="active" data-mode="orbit"><i data-lucide="box"></i>3D 鳥瞰</button>
      <button data-mode="top"><i data-lucide="map"></i>俯視</button>
      <button data-mode="walk"><i data-lucide="footprints"></i>地面漫遊</button>
    </div>

    <div class="map-toolbar">
      <button class="tool-btn" id="compass" title="指北針">
        <i data-lucide="compass"></i>
      </button>
      <button class="tool-btn" id="reset-view" title="回到校園全景">
        <i data-lucide="scan"></i>
      </button>
      <button class="tool-btn" id="rotate-btn" title="自動環繞旋轉">
        <i data-lucide="rotate-3d"></i>
      </button>
      <button class="tool-btn" id="day-btn" title="切換日夜氛圍">
        <i data-lucide="sun-moon"></i>
      </button>
      <button class="tool-btn" id="fullscreen-btn" title="全螢幕">
        <i data-lucide="maximize"></i>
      </button>
    </div>

    <section class="detail-card" id="detail-card">
      <div class="detail-header">
        <h3 id="detail-title">校舍名稱</h3>
        <button class="close-btn" id="close-detail"><i data-lucide="x"></i></button>
      </div>
      <span class="detail-category" id="detail-category">分類</span>
      <p id="detail-description">詳細說明文字</p>
      <div class="tag-container" id="detail-tags"></div>
    </section>

    <div class="bottom-bar">
      <button class="pill-btn" id="tour-btn">
        <i data-lucide="play"></i>精選校園巡航（12 站）
      </button>
    </div>

    <div class="tourbar" id="tourbar" hidden>
      <button class="close-btn" id="tour-prev"><i data-lucide="skip-back"></i></button>
      <span id="tour-counter" style="font-size: 13px; font-weight: 700;">01 / 12</span>
      <span id="tour-name" style="font-size: 14px; font-weight: 700; color: var(--primary);">民族路新大門</span>
      <div class="tour-progress"><span id="tour-progress"></span></div>
      <button class="close-btn" id="tour-next"><i data-lucide="skip-forward"></i></button>
      <button class="close-btn" id="tour-close"><i data-lucide="x"></i></button>
    </div>

    <div class="walk-controls" id="walk-controls" hidden>
      按鍵盤 WASD 或方向鍵行走 · 滑鼠拖曳環顧四周 · 按 Esc 返回鳥瞰
    </div>

    <dialog id="offices-dialog">
      <div class="dialog-header">
        <h2>行政處室與專科教室配置表</h2>
        <button class="close-btn" data-close><i data-lucide="x"></i></button>
      </div>
      <div id="offices-content"></div>
    </dialog>

    <dialog id="grades-dialog">
      <div class="dialog-header">
        <h2>115 學年度全校年級教室配置</h2>
        <button class="close-btn" data-close><i data-lucide="x"></i></button>
      </div>
      <div id="grades-content"></div>
    </dialog>

    <dialog id="map-dialog" style="max-width: 880px;">
      <div class="dialog-header">
        <h2>羅東國小校園平面與防災避難地圖</h2>
        <button class="close-btn" data-close><i data-lucide="x"></i></button>
      </div>
      <img src="assets/羅小防災地圖.jpg" alt="羅東國小校園防災地圖" style="width: 100%; border-radius: 8px;">
    </dialog>
  </div>

  <script type="module" src="src/app.js?v=__BUILD__"></script>
</body>
</html>
