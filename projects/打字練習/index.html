<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>羅東國小打字練習網 — 英打指法</title>
<link rel="stylesheet" href="styles.css?v=__BUILD__">
</head>
<body>

<div class="sky" aria-hidden="true"></div>

<!-- 提示條浮在畫面上方，不佔版面高度。
     原本它在版面流裡，一跳出來就把鍵盤和手指圖例往下擠出首屏。 -->
<div class="notice" id="notice" role="status" aria-live="polite">
  <span id="noticeText"></span>
  <button class="notice-close" id="noticeClose" type="button" aria-label="關掉這則提示">✕</button>
</div>

<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <h1>羅東國小打字練習網</h1>
      <span class="badge" id="modeLabel">英打指法</span>
      <div class="mode-switch" aria-label="練習模式">
        <button class="mode-option is-active" id="modeEN" type="button" aria-pressed="true">英打</button>
        <button class="mode-option" id="modeZH" type="button" aria-pressed="false">注音</button>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-id" id="btnStudent" type="button" aria-expanded="false" aria-controls="idPanel">
        <span id="studentLabel">👤 點我填班級座號</span>
        <span class="sync-badge" id="syncBadge" hidden></span>
      </button>
      <button class="btn" id="btnFree" type="button" aria-pressed="false">🐢 自由練習：關</button>
      <button class="btn" id="btnRestart" type="button">🔄 重來一次</button>
    </div>
  </div>

  <!-- 電腦教室的機器是共用的，孩子每週不一定坐同一台。
       進度綁「班級-座號」而不是綁這台電腦，下一節課的孩子才不會看到別人的星星。
       年段也從班級號碼推出來，用來調整第三顆星的速度標準。 -->
  <form class="id-panel" id="idPanel" hidden>
    <label for="inputClass">班級</label>
    <input id="inputClass" type="text" inputmode="numeric" maxlength="8" placeholder="301" autocomplete="off">
    <label for="inputSeat">座號</label>
    <input id="inputSeat" type="text" inputmode="numeric" maxlength="4" placeholder="15" autocomplete="off">
    <button class="btn btn-primary" type="submit">記住我</button>
    <span class="id-hint" id="idHint"></span>
  </form>

  <div class="levels" id="levels"></div>

  <dl class="stats">
    <div class="stat"><dt>正確率</dt><dd id="statAcc">100<small>%</small></dd></div>
    <div class="stat" id="wpmStat"><dt id="statWpmLabel">每分鐘字數</dt><dd id="statWpm">0</dd></div>
    <div class="stat"><dt>連續答對</dt><dd id="statCombo">0</dd></div>
    <div class="stat"><dt>進度</dt><dd id="statProgress">0<small>/10</small></dd></div>
  </dl>

  <div class="stage" id="practiceStage" tabindex="-1">

    <div class="mascot-row">
      <div class="mascot" id="mascot" data-mood="idle">
        <svg viewBox="0 0 100 100" role="img" aria-label="吉祥物小鍵">
          <!-- 身體就是一顆鍵帽：下面深色那層是鍵帽的側面，露出來才有厚度。
               圓角刻意不放太大——太圓就變成一顆頭，看不出是按鍵了。 -->
          <rect class="m-side" x="13" y="30" width="74" height="56" rx="15"/>
          <rect class="m-top"  x="13" y="16" width="74" height="58" rx="14"/>
          <!-- 小手 -->
          <circle class="m-hand" cx="8"  cy="68" r="6"/>
          <circle class="m-hand" cx="92" cy="68" r="6"/>
          <!-- 腮紅 -->
          <ellipse class="m-blush" cx="30" cy="57" rx="6" ry="3.6"/>
          <ellipse class="m-blush" cx="70" cy="57" rx="6" ry="3.6"/>

          <!-- 眼睛：平常 -->
          <g class="m-eyes m-eyes-idle">
            <circle cx="39" cy="44" r="6"/>
            <circle cx="61" cy="44" r="6"/>
            <circle class="m-glint" cx="41" cy="42" r="2"/>
            <circle class="m-glint" cx="63" cy="42" r="2"/>
          </g>
          <!-- 眼睛：開心（彎彎的） -->
          <g class="m-eyes m-eyes-happy">
            <path d="M33 46 Q39 38 45 46"/>
            <path d="M55 46 Q61 38 67 46"/>
          </g>
          <!-- 眼睛：嚇一跳（睜大） -->
          <g class="m-eyes m-eyes-oops">
            <circle cx="39" cy="44" r="8"/>
            <circle cx="61" cy="44" r="8"/>
            <circle class="m-glint" cx="42" cy="41" r="2.6"/>
            <circle class="m-glint" cx="64" cy="41" r="2.6"/>
          </g>
          <!-- 眼睛：超開心（星星眼） -->
          <g class="m-eyes m-eyes-cheer">
            <path d="M39 36 L41.6 42 L48 44 L41.6 46 L39 52 L36.4 46 L30 44 L36.4 42 Z"/>
            <path d="M61 36 L63.6 42 L70 44 L63.6 46 L61 52 L58.4 46 L52 44 L58.4 42 Z"/>
          </g>

          <!-- 嘴巴 -->
          <path class="m-mouth m-mouth-idle"  d="M44 58 Q50 63 56 58"/>
          <path class="m-mouth m-mouth-happy" d="M42 57 Q50 68 58 57 Z"/>
          <ellipse class="m-mouth m-mouth-oops" cx="50" cy="60" rx="4" ry="5"/>
          <path class="m-mouth m-mouth-cheer" d="M40 56 Q50 71 60 56 Z"/>
        </svg>
      </div>
      <p class="bubble" id="mascotBubble">準備好了嗎？</p>
    </div>

    <p class="stage-label" id="stageLabel">請按下畫面上發亮的那顆鍵</p>

    <div class="word" id="word"></div>

    <!-- 中文進階關（第 7～10 關）才會出現。前六關要求學生維持英數模式，
         判分靠 keydown 的實體鍵位；這四關相反，非得真的切成注音輸入法組字選字
         不可，而組字過程瀏覽器只會在結束後給我們一個中文字——那只有輸入框收得到。 -->
    <div class="ime-box" id="imeBox" hidden>
      <label class="ime-label" for="imeInput">打在這裡 👉</label>
      <input type="text" id="imeInput" lang="zh-Hant"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
             aria-label="用注音輸入法把上面的字打出來">
      <span class="ime-tip">拼完記得選字，選錯可以用退格改</span>
    </div>

    <div class="finger-hint" id="fingerHint">
      <span class="finger-dot" id="fingerDot"></span>
      <span id="fingerText">準備好了嗎？</span>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="keyboard" id="keyboard"></div>

  <div class="foot-row">
    <div class="legend" id="legend"></div>
    <!-- 老師端入口。放這裡而不是另起一行，是因為 1265×710 的筆電
         首屏高度剛好用完，多一行就會把手指圖例擠出去。 -->
    <a class="teacher-link" href="teacher.html">👩‍🏫 老師端</a>
  </div>

</div>

<div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
  <div class="modal" id="resultModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <div class="stars" id="modalStars"></div>
    <h2 id="modalTitle">這一關完成了！</h2>
    <div class="result-grid">
      <div><b id="modalAcc">—</b><span>正確率</span></div>
      <div id="modalWpmStat"><b id="modalWpm">—</b><span id="modalWpmLabel">每分鐘字數</span></div>
    </div>
    <div class="misses" id="modalMisses"></div>
    <div class="btn-row" style="justify-content:center">
      <button class="btn" id="modalRetry" type="button">再打一次</button>
      <button class="btn btn-primary" id="modalNext" type="button">下一關 →</button>
    </div>
  </div>
</div>

<!-- 雲端設定。GitHub Actions 部署時才會生成這個檔，本機開／隨身碟開時它不存在，
     那是刻意的：沒有它 cloud.js 就整個靜默停用，孩子照樣練、成績照樣存在本機。
     所以 file:// 底下 console 會有一則 404，那不是壞掉。 -->
<script src="firebase-config.js?v=__BUILD__"></script>

<script src="js/keymap.js?v=__BUILD__"></script>
<script src="js/levels-en.js?v=__BUILD__"></script>
<script src="js/levels-zhuyin.js?v=__BUILD__"></script>
<script src="js/levels-en-adv.js?v=__BUILD__"></script>
<script src="js/levels-zh-adv.js?v=__BUILD__"></script>
<script src="js/engine.js?v=__BUILD__"></script>
<script src="js/keyboard.js?v=__BUILD__"></script>
<script src="js/mascot.js?v=__BUILD__"></script>
<script src="js/cloud.js?v=__BUILD__"></script>
<script src="js/app.js?v=__BUILD__"></script>
</body>
</html>
